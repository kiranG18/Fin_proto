<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinLit Checkpoint prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e9eaec;--card:#fff;--tile:#f4f4f5;--ink:#141416;--ink2:#5d6068;--ink3:#8b8e96;--line:#e6e7ea;
  --accent:#f15a24;--accent2:#ff8a4d;--accentSoft:#fdece4;--dark:#151517;--onDark:#fff;
  --good:#1e9e5a;--goodBg:#e5f6ec;--bad:#e5484d;--badBg:#fde9e8;--warn:#d99a06;--warnBg:#fdf3d7;
  --shadow:0 1px 2px rgba(20,20,22,.04);
  --r:26px;--rs:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0d0d0f;--card:#18181b;--tile:#232327;--ink:#f3f3f5;--ink2:#a5a8b0;--ink3:#767981;--line:#2b2b30;
  --accentSoft:#3a2219;--dark:#f3f3f5;--onDark:#141416;
  --goodBg:#12301f;--badBg:#3a1a1c;--warnBg:#3a2f0e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:76px 1fr;gap:18px;padding:16px 18px 24px;max-width:1560px;margin:0 auto}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;position:relative}
.pill{background:var(--card);border-radius:999px;padding:8px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;padding:8px 22px 8px 10px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo .mark{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.navpill{margin:0 auto;padding:8px 10px}
.navpill button{padding:11px 20px;border-radius:999px;color:var(--ink2);font-weight:500}
.navpill button:hover{color:var(--ink)}
.navpill button.on{background:var(--dark);color:var(--onDark)}
.actpill{gap:2px;padding:6px 10px}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative}
.ibtn:hover{background:var(--tile)}
.ibtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.userchip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:8px 14px 8px 8px;min-width:230px;box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#2b2b30,#55555c);color:#fff;display:grid;place-items:center;font-weight:600}
.userchip .n{font-weight:600;line-height:1.2}.userchip .e{font-size:12px;color:var(--ink3);line-height:1.2}
.userchip>div{flex:1;text-align:left}
.rail{display:flex;flex-direction:column;gap:14px;align-items:center;position:sticky;top:14px;align-self:start;height:calc(100vh - 110px);min-height:520px}
.rail .grp{background:var(--card);border-radius:999px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.rail .ibtn{width:44px;height:44px}
.rail .ibtn.on{background:var(--dark);color:var(--onDark)}
.rail .sp{flex:1}
.main{min-width:0}
h1.greet{font-size:38px;line-height:1.1;letter-spacing:-.03em;font-weight:600;margin:14px 0 6px}
.sub{color:var(--ink2);margin:0 0 20px}
.grid>*{min-width:0}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1.05fr) minmax(0,1.05fr) minmax(0,1.1fr);grid-template-areas:"bal tiles chart"}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.card .hint{color:var(--ink2);font-size:13px;margin-top:2px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.bal .lbl{color:var(--ink2);font-size:14px}
.big{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:6px 0 8px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:500}
.badge.g{background:var(--goodBg);color:var(--good)}.badge.r{background:var(--badBg);color:var(--bad)}.badge.w{background:var(--warnBg);color:var(--warn)}.badge.n{background:var(--tile);color:var(--ink2)}
.sel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:500;background:var(--card)}
.sel select{border:0;background:none;outline:0;font-weight:500;cursor:pointer;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:600;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--dark);color:var(--onDark)}
.btn.soft{background:var(--tile);color:var(--ink)}
.btn.acc{background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff}
.btn.line{border:1.5px solid var(--line);background:var(--card)}
.btn.sm{padding:9px 16px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.walletbox{background:var(--tile);border-radius:20px;padding:12px}
.walletbox .t{font-size:13px;color:var(--ink2);margin:0 0 10px 4px}.walletbox .t b{color:var(--ink);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini button{text-align:left;background:var(--card);border-radius:14px;padding:10px;display:block;border:1px solid transparent}
.mini button:hover{border-color:var(--line)}
.mini .f{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.mini .f i{width:16px;height:16px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.mini .f i.m{background:var(--dark)}.mini .f i.ix{background:var(--ink3)}
.mini .a{font-size:16px;font-weight:600;margin:6px 0 2px;letter-spacing:-.02em}
.mini .s{font-size:11px;color:var(--ink3)}
.mini .st{font-size:11px;margin-top:4px;font-weight:500}
.st.ok{color:var(--good)}.st.pa{color:var(--warn)}.st.no{color:var(--bad)}
.tiles{grid-area:tiles;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;background:var(--card);border-radius:var(--r);padding:14px}
.tile{background:var(--tile);border-radius:22px;padding:16px;text-align:left;display:block;min-height:132px;position:relative;transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile .ic{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink2)}
.tile .l{color:var(--ink2);font-size:14px;max-width:70%}
.tile{min-width:0}
.tile .v{font-size:clamp(20px,2vw,30px);font-weight:600;letter-spacing:-.03em;margin:14px 0 8px}
.tile.hot{background:linear-gradient(150deg,#f15a24,#ff9a5c);color:#fff}
.tile.hot .l{color:rgba(255,255,255,.85)}.tile.hot .ic{background:rgba(255,255,255,.22);color:#fff}
.tile.hot .badge{background:rgba(255,255,255,.22);color:#fff}
.chartcard{grid-area:chart}
.chartbox{background:var(--tile);border-radius:20px;padding:14px;margin-top:14px}
.chartbox .top{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:6px}
.legend{display:flex;gap:12px;font-weight:500;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.hatch{background:repeating-linear-gradient(135deg,#f15a24 0 3px,#ff8a4d 3px 6px)}
svg text{font-family:inherit;fill:var(--ink3);font-size:11px}
.bal{grid-area:bal}.lim{grid-area:lim}.cards{grid-area:cards}.act{grid-area:act}
.bar{height:16px;border-radius:999px;background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);overflow:hidden;margin:16px 0 8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .4s}
.barfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}.barfoot b{color:var(--ink)}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:hidden}
.gcard{border-radius:20px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;position:relative;background:linear-gradient(150deg,#26262a,#0f0f11)}
.gcard.o{background:linear-gradient(150deg,#f15a24,#ff9a5c)}
.gcard .p{align-self:flex-start;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500}
.gcard .nm{font-weight:600;font-size:15px}
.gcard .mt{display:flex;justify-content:space-between;font-size:11px;opacity:.85}
.gcard .mt b{display:block;font-size:13px;font-weight:600;opacity:1;margin-top:2px}
.act .tools{display:flex;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;min-width:220px;background:var(--card)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.fbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 16px;height:44px;font-weight:500;background:var(--card)}
.tablewrap{border:1px solid var(--line);border-radius:18px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--tile);color:var(--ink2);font-weight:500;text-align:left;padding:13px 14px;font-size:13px;white-space:nowrap}
td{padding:14px;border-top:1px solid var(--line);white-space:nowrap}
tr.sel td{background:var(--tile)}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink3);display:inline-grid;place-items:center;vertical-align:middle;background:var(--card)}
.chk.on{background:var(--dark);border-color:var(--dark);color:var(--onDark)}
.chk svg{width:12px;height:12px;stroke-width:3}
.actname{display:flex;align-items:center;gap:10px;font-weight:500}
.actname .ai{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accentSoft);color:var(--accent);flex:none}
.dot2{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.empty{padding:30px;text-align:center;color:var(--ink2)}
.pop{position:absolute;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:8px;min-width:230px}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.pop .it:hover{background:var(--tile)}
.pop .ttl{padding:8px 12px;font-weight:600;font-size:13px;color:var(--ink2)}
.pop .note{padding:10px 12px;border-radius:12px;text-align:left;width:100%;display:block}
.pop .note:hover{background:var(--tile)}.pop .note b{display:block;font-weight:600}.pop .note span{color:var(--ink2);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:80;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:28px;width:min(560px,100%);padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.modal.wide{width:min(900px,100%)}
.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em;font-weight:600}
.modal .lead{color:var(--ink2);margin:0 0 18px}
.x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:var(--tile);display:grid;place-items:center;z-index:2}
.field{display:block;margin:0 0 14px}.field>span{display:block;font-weight:500;margin-bottom:6px;color:var(--ink2);font-size:13px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;width:100%;background:var(--card)}
.opt:hover{border-color:var(--ink3)}
.opt.on{border-color:var(--accent);background:var(--accentSoft)}
.opt .oi{width:38px;height:38px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none}
.opt.on .oi{background:var(--accent);color:#fff}
.opt b{display:block;font-weight:600}.opt span.d{color:var(--ink2);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:500;background:var(--card)}
.chip:hover{border-color:var(--ink3)}.chip.on{background:var(--dark);color:var(--onDark);border-color:var(--dark)}
.tabs{display:inline-flex;background:var(--tile);border-radius:999px;padding:4px;gap:2px}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:500;color:var(--ink2)}
.tabs button.on{background:var(--dark);color:var(--onDark)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-weight:600}.row .d{color:var(--ink2);font-size:13px}
.pagehd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stat{background:var(--tile);border-radius:20px;padding:16px}.stat .l{color:var(--ink2);font-size:13px}.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--tile);font-size:12px;font-weight:500;color:var(--ink2)}
.tag.o{background:var(--accentSoft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--onDark);padding:12px 20px;border-radius:999px;z-index:200;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
/* checkpoint */
.cp{width:min(760px,100%);background:var(--card);border-radius:30px;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.4);display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.cp .cphd{display:flex;align-items:center;gap:12px;padding:20px 26px 0}
.cp .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.cp .brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.steps{display:flex;gap:6px;margin-left:auto;margin-right:44px}
.steps i{width:34px;height:6px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--accent)}
.cp .body{padding:20px 26px;overflow:auto;flex:1}
.cp h2{font-size:26px;letter-spacing:-.025em;margin:0 0 6px;font-weight:600;line-height:1.2}
.cp .lead{color:var(--ink2);margin:0 0 18px;font-size:15px}
.cp .foot{padding:14px 26px 22px;border-top:1px solid var(--line)}
.cp .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cp .disc{color:var(--ink3);font-size:11.5px;margin-top:12px;line-height:1.4}
.linkbtn{color:var(--ink2);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:8px 4px}
.linkbtn:hover{color:var(--ink)}
.headline{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:0 0 6px}
.reach{color:var(--ink2);margin:0 0 14px}
.legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:8px 0 2px}
.legend2 i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}
.slidewrap{background:var(--tile);border-radius:18px;padding:14px 16px;margin:12px 0}
.slidewrap .top{display:flex;justify-content:space-between;font-weight:500;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--accent);height:24px}
.futures{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.futures .fu{border-radius:18px;padding:14px;background:var(--tile)}
.futures .fu.after{background:var(--accentSoft)}
.futures .fu .t{font-size:12.5px;color:var(--ink2);font-weight:500}
.futures .fu .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:4px 0}
.futures .fu .r{font-size:12.5px;color:var(--ink2)}
.callout{background:var(--tile);border-radius:16px;padding:14px 16px;margin:12px 0;color:var(--ink2)}
.callout.ok{background:var(--goodBg);color:var(--good)}
.callout.warn{background:var(--warnBg);color:var(--warn)}
.epis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.epis .e{background:var(--tile);border-radius:16px;padding:12px}.epis .e b{display:block;font-size:18px;letter-spacing:-.02em}.epis .e span{font-size:12px;color:var(--ink2);display:block}
.optcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.oc{border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.oc:hover{border-color:var(--ink3)}
.oc.on{border-color:var(--accent);background:var(--accentSoft)}
.oc b{font-weight:600}.oc .e{color:var(--ink2);font-size:13px;flex:1}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.three .btn{width:100%;padding:16px 10px;white-space:normal;text-align:center;line-height:1.25;min-height:60px}
.three.two{grid-template-columns:1fr 1fr}
.drawer{position:absolute;inset:0;background:var(--card);border-radius:30px;z-index:5;display:flex;flex-direction:column}
.drawer .dbody{padding:26px;overflow:auto;flex:1}
.drawer h2{font-size:22px;margin:0 0 4px}
.drawer ol{margin:0;padding:0;list-style:none;counter-reset:s}
.drawer li{padding:14px 0;border-top:1px solid var(--line)}
.drawer li h4{margin:0 0 4px;font-size:14px}
.drawer li p,.drawer li ul{margin:0;color:var(--ink2);font-size:13.5px}
.drawer li ul{padding-left:18px}
.range3{position:relative;height:26px;margin:6px 0 2px}

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast"></div>
<script>
/* ===== DATA + ENGINE ===== */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* Prototype series. Calendar-year Nifty 50 returns anchor each year, the monthly path inside a year is seeded.
   Replace NAV_OVERRIDE with real AMFI monthly NAV arrays ({index:[...],flexi:[...],mid:[...]}, first value = start of Jan 2004). */
const ANNUAL={2004:10.7,2005:36,2006:39.8,2007:54.8,2008:-51.8,2009:75.8,2010:17.9,2011:-24.6,2012:27.7,2013:6.8,2014:31.4,2015:-4.1,2016:3.0,2017:28.6,2018:3.2,2019:12.0,2020:14.9,2021:24.1,2022:4.3,2023:20.0,2024:8.8,2025:10.5};
const SHAPE={
 2008:[-16,2,-8,8,-3,-13,7,1,-12,-26,-7,7],
 2020:[-1.7,-6.4,-23.2,14.7,-2.8,7.5,7.5,2.9,-1.2,3.5,11.4,7.8]
};
const Y2026=[-0.5,1.2,-2.6,2.4,1.1,-1.0,0.8,1.5,-0.6];
const NAV_START={y:2004,m:0};
function buildSeries(){
  const r=mulberry32(20261005), rIdx=[];
  for(let y=2004;y<=2025;y++){
    const target=Math.log(1+ANNUAL[y]/100);
    let ms=SHAPE[y]?SHAPE[y].map(v=>Math.log(1+v/100)):Array.from({length:12},()=>gauss(r)*0.038);
    const adj=(target-ms.reduce((a,b)=>a+b,0))/12;
    ms=ms.map(v=>v+adj);
    rIdx.push(...ms);
  }
  Y2026.forEach(v=>rIdx.push(Math.log(1+v/100)));
  const r2=mulberry32(77), r3=mulberry32(91);
  const mk=(f)=>{const a=[100];rIdx.forEach((x,i)=>a.push(a[i]*Math.exp(f(x,i))));return a};
  return {
    index:mk(x=>x),
    flexi:mk(x=>0.92*x+0.0018+gauss(r2)*0.008),
    mid:mk(x=>1.22*x+0.0025+gauss(r3)*0.015)
  };
}
let SERIES=(typeof NAV_OVERRIDE!=='undefined'&&NAV_OVERRIDE)||buildSeries();
const N_LEVELS=SERIES.index.length;
function monthAt(k){const t=NAV_START.m+k;return {y:NAV_START.y+Math.floor(t/12),m:t%12}}
function monthLabel(o){return MONTHS[o.m]+' '+o.y}
const FIRST_NAV_LABEL=monthLabel(monthAt(0)), LAST_NAV_LABEL=monthLabel(monthAt(N_LEVELS-1));

const FUNDS={
  flexi:{key:'flexi',label:'Sample Flexi Cap Fund',bench:'index'},
  mid:{key:'mid',label:'Sample Mid Cap Fund',bench:'index'},
  index:{key:'index',label:'Sample Nifty 50 Index Fund',bench:'index'}
};
const EXTRA=36, MIN_WINDOWS=60;
function getNav(fundKey,nTotal,flags){
  let nav=SERIES[fundKey];
  if(flags&&flags.shortHistory&&fundKey!=='index') nav=nav.slice(nav.length-100);
  const wins=nav.length-nTotal;
  if(wins<MIN_WINDOWS) return {nav:SERIES.index,proxy:true,label:FUNDS[fundKey].label};
  return {nav,proxy:false,label:FUNDS[fundKey].label};
}
function pct(sorted,p){const i=(sorted.length-1)*p/100,lo=Math.floor(i),hi=Math.ceil(i);return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo)}
function planContribs(kind,amount,n,pauseLeft){
  // kind: 'keep' | 'stop' | 'pause_k' | 'reduce_p'
  let base=Array(n).fill(amount);
  for(let i=0;i<Math.min(pauseLeft||0,n);i++) base[i]=0;
  if(kind==='keep')return base;
  if(kind==='stop')return Array(n).fill(0);
  const [k,v]=kind.split('_'),val=+v;
  if(k==='pause'){const a=base.slice();for(let i=0;i<Math.min((pauseLeft||0)+val,n);i++)a[i]=0;return a}
  if(k==='reduce'){return base.map(x=>x===0?0:amount*(1-val/100))}
  if(k==='raise'){return base.map(x=>x===0?0:amount*(1+val/100))}
  if(k==='move')return base;
  throw new Error(kind);
}
function simSip(nav,c0,contribs,nWin){
  const n=contribs.length,out=new Float64Array(nWin*n);
  for(let s=0;s<nWin;s++){
    let units=c0/nav[s];
    for(let t=0;t<n;t++){units+=contribs[t]/nav[s+t];out[s*n+t]=units*nav[s+t+1]}
  }
  return out;
}
const _cache=new Map();
function sipPaths(sip,kind,H,flags){
  const nTotal=H+EXTRA;
  const info=getNav(sip.fundKey,nTotal,flags);
  const key=[sip.id,sip.fundKey,sip.value,sip.amount,sip.pauseLeft||0,sip.status,kind,H,info.proxy,(flags&&flags.shortHistory)?1:0].join('|');
  if(_cache.has(key))return {..._cache.get(key),info};
  const nWin=info.nav.length-nTotal;
  const amt=sip.status==='cancelled'?0:sip.amount;
  const contribs=planContribs(kind,amt,nTotal,sip.pauseLeft);
  const paths=simSip(info.nav,sip.value,contribs,nWin);
  const res={paths,nWin,nTotal};
  _cache.set(key,res);
  return {...res,info};
}
/* goal-level: sum the SIPs on the goal; the changed SIP follows `kind`, the others keep. */
function twoFutures(sips,changedId,kind,H,target,flags){
  // per-SIP window counts may differ (proxy); align to the minimum count using the latest windows
  const parts=sips.map(s=>sipPaths(s,s.id===changedId?kind:'keep',H,flags));
  const nWin=Math.min(...parts.map(p=>p.nWin)),nTotal=H+EXTRA;
  const tot=new Float64Array(nWin*nTotal);
  parts.forEach(p=>{const off=(p.nWin-nWin)*nTotal;for(let i=0;i<nWin*nTotal;i++)tot[i]+=p.paths[off+i]});
  const atGoal=[],hit=[],series=[[],[],[]];
  for(let s=0;s<nWin;s++){
    atGoal.push(tot[s*nTotal+H-1]);
    let h=Infinity;
    if(target!=null){for(let t=0;t<nTotal;t++){if(tot[s*nTotal+t]>=target){h=t+1;break}}}
    hit.push(h);
  }
  const sorted=atGoal.slice().sort((a,b)=>a-b);
  for(let t=0;t<H;t++){
    const col=new Array(nWin);for(let s=0;s<nWin;s++)col[s]=tot[s*nTotal+t];col.sort((a,b)=>a-b);
    series[0].push(pct(col,10));series[1].push(pct(col,50));series[2].push(pct(col,90));
  }
  const hs=hit.slice().sort((a,b)=>a-b),med=pct(hs,50);
  return {
    p10:pct(sorted,10),p50:pct(sorted,50),p90:pct(sorted,90),
    pctReach:target!=null?atGoal.filter(v=>v>=target).length/nWin*100:null,
    medianMonths:isFinite(med)?med:null,
    s10:series[0],s50:series[1],s90:series[2],
    nWindows:nWin,proxyUsed:parts.some(p=>p.info.proxy),
    firstDate:monthLabel(monthAt(0)),lastDate:monthLabel(monthAt(N_LEVELS-1))
  };
}
/* drawdown episodes on monthly levels */
function episodesFor(fundKey){
  const nav=SERIES[fundKey==='index'?'index':fundKey],eps=[];
  let peak=nav[0],pk=0,cur=null;
  for(let k=1;k<nav.length;k++){
    const v=nav[k];
    if(v>=peak){
      if(cur){cur.recover=k-cur.troughK;eps.push(cur);cur=null}
      peak=v;pk=k;continue;
    }
    const dd=v/peak-1;
    if(dd<=-0.10){
      if(!cur)cur={peakK:pk,troughK:k,size:dd};
      if(dd<cur.size){cur.size=dd;cur.troughK=k}
    }
  }
  if(cur){cur.recover=null;eps.push(cur)}
  const currentDD=nav[nav.length-1]/Math.max(...nav)-1;
  return {eps:eps.map(e=>({peak:monthLabel(monthAt(e.peakK)),trough:monthLabel(monthAt(e.troughK)),size:e.size*100,months:e.recover})),currentDD:currentDD*100};
}
function ddRank(eps,dd){ // dd negative number in %
  const sizes=eps.map(e=>e.size).concat([dd]).sort((a,b)=>a-b);
  return sizes.indexOf(dd)+1;
}
function rollingReturns(fundKey,months=36){
  const nav=SERIES[fundKey],b=SERIES.index,out={f:[],b:[]};
  for(let k=0;k+months<nav.length;k++){
    out.f.push((Math.pow(nav[k+months]/nav[k],12/months)-1)*100);
    out.b.push((Math.pow(b[k+months]/b[k],12/months)-1)*100);
  }
  return out;
}

function filterCheck(txt){
  const bad=[];
  if(/\d/.test(txt))bad.push('contains a digit');
  (txt.match(/\{(\w+)\}/g)||[]).forEach(t=>{if(!ALLOWED_SLOTS.includes(t.slice(1,-1)))bad.push('unknown slot '+t)});
  DENY.forEach(r=>{if(r.test(txt))bad.push('deny-list: '+r.source)});
  txt.split(/[.!?]+\s/).forEach(s=>{if(s.trim().split(/\s+/).length>25)bad.push('sentence over 25 words')});
  return bad;
}
function filterReport(){
  const keys=Object.keys(NARR);let fails=0;keys.forEach(k=>{if(filterCheck(NARR[k]).length)fails++});
  const bad=filterCheck(BAD_NARR);
  return {total:keys.length,fails,sample:BAD_NARR,sampleReasons:bad};
}
function narr(key,slots){
  let raw=(S.flags.badNarr&&(key==='headline'||key==='headline_pct'||key==='nogoal_head'))?BAD_NARR:NARR[key];
  const issues=filterCheck(raw);
  if(issues.length){S._fbSeen=S._fbSeen||{};if(!S._fbSeen[key]){S._fbSeen[key]=1;track('error_fallback',{type:'narration_filter',reason:issues[0]})}S.usedFallback=true;raw=FALLBACK[key]||FALLBACK.headline}
  return raw.replace(/\{(\w+)\}/g,(m,k)=>slots[k]!=null?slots[k]:'');
}

function gainBars(){

  const labels=['Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  return labels.map((l,i)=>{
    const inv=I-m*(7-i);let g;
    if(S.mode==='calm')g=gPeak*(0.3+0.7*i/7)*(1+((i%3)-1)*0.1);
    else{const pk=4;g=i<=pk?gPeak*(0.3+0.7*i/pk):gPeak+(gEnd-gPeak)*(i-pk)/(7-pk)}
    if(i===7)g=gEnd;
    return {l,gain:inv*g}
  });
}
function chartGain(){

  const neg=d.some(x=>x.gain<0),y0=neg?pt+(H-pt-pb)/2:H-pb,sc=(neg?(H-pt-pb)/2:(H-pt-pb))/mx,bw=(W-pl-10)/d.length;

  d.forEach((x,i)=>{
    const h=Math.abs(x.gain)*sc,cx=pl+i*bw+bw*.18,w=bw*.64,pos=x.gain>=0;
    g+=`<g><title>${x.l}: ${pos?'gain':'loss'} of ${inr(Math.abs(x.gain))}</title><rect x="${cx}" y="${pos?y0-h:y0}" width="${w}" height="${Math.max(h,2)}" rx="8" fill="${pos?'url(#hat)':'var(--dark)'}"/></g><text x="${cx+w/2}" y="${H-6}" text-anchor="middle">${x.l}</text>`;
  });

}

function suggestions(){
  const out=[],d=S.d,name=s=>FUNDS[s.fundKey].label.replace('Sample ','');
  const active=d.sips.filter(s=>s.status!=='cancelled');
  if(!d.goals.length&&active.length)out.push({i:'target',t:'Add a goal',b:'Checkpoint can only measure a SIP change in rupees and months once a goal exists.',btn:'Add a goal',a:'modal',p:'goalnew'});

  d.goals.forEach(g=>{
    const linked=active.filter(s=>s.goalId===g.id),H=monthsTo(g.date);if(!linked.length||H<12)return;
    try{
      const base=twoFutures(linked,null,'keep',H,g.target,S.flags);
      if(base.pctReach<70){
        const top=linked.slice().sort((a,b)=>b.amount-a.amount)[0],na=Math.round(top.amount*1.25/100)*100;
        const r=twoFutures(linked,top.id,'raise_25',H,g.target,S.flags);
        out.push({i:'trend',t:'Improve the odds on '+g.name,b:`Today ${Math.round(base.pctReach)}% of past windows reach this goal. With your ${name(top)} SIP at ${inr(na)}, ${Math.round(r.pctReach)}% do.`,btn:'Raise to '+inr(na),a:'raiseask',p:top.id+':'+na})}
    }catch(e){}
  });
  d.sips.filter(s=>s.status==='cancelled').forEach(s=>out.push({i:'refresh',t:'Restart '+name(s),b:'You cancelled this SIP. Restart it to resume monthly investing.',btn:'Restart SIP',a:'restart',p:s.id}));

}

function fundShares(){
  const m={};S.d.sips.filter(s=>s.status!=='cancelled').forEach(s=>{m[s.fundKey]=(m[s.fundKey]||0)+(sipVal(s)>0?sipVal(s):0)});

  const tot=ent.reduce((a,[k,v])=>a+v,0)||1;

function healthChecks(){
  const d=S.d,out=[],sh=fundShares(),act=d.sips.filter(s=>s.status!=='cancelled');
  if(!d.goals.length)out.push({i:'target',t:'Goal on track',st:'watch',hl:'No goal set yet',b:'Checkpoint can show ranges without a goal. It cannot say whether you are on track.',why:'A goal turns a SIP change into rupees and months.',btn:'Add a goal',a:'modal',p:'goalnew'});
  d.goals.slice(0,2).forEach(g=>{
    const st=goalStatus(g);
    if(!st)out.push({i:'target',t:'Goal on track: '+g.name,st:'watch',hl:'No SIP linked yet',b:'Link a SIP to this goal to see whether it is on track.',why:'Checkpoint measures a change against the SIPs that feed a goal.',btn:'View goal',a:'view',p:'goals'});
    else if(st.short)out.push({i:'target',t:'Goal on track: '+g.name,st:'info',hl:'Under 12 months away',b:'With a short horizon the range of outcomes is wide, so one on-track number would mislead.',why:'Checkpoint shows a range in this case.',btn:'View goal',a:'view',p:'goals'});
    else{const r=Math.round(st.reach);out.push({i:'target',t:'Goal on track: '+g.name,st:r>=70?'good':r>=40?'watch':'risk',hl:r+'% of past windows reach it',b:`Of ${st.n} past start dates, ${r}% ended at or above ${lakhTxt(g.target)} by ${goalLabel(g.date)}. The middle case ends near ${lakhTxt(st.p50)}.`,why:'This is a history check, not a forecast. It shows how often a plan like yours reached the target.',btn:'View goal',a:'view',p:'goals'})}
  });

const replayEps=fk=>episodesFor(fk).eps.filter(e=>e.size<=-15).sort((a,b)=>parseM(a.peak)-parseM(b.peak));
function replayCalc(fk,ep,amt,stopAfter){
  const nav=SERIES[fk],pk=parseM(ep.peak),s0=Math.max(0,pk-12),len=Math.min(72,nav.length-1-s0),stopT=pk+stopAfter-s0;
  const run=fn=>{let u=0,inv=0;const line=[];for(let t=0;t<len;t++){const c=fn(t);u+=c/nav[s0+t];inv+=c;line.push(u*nav[s0+t+1])}return {line,inv,end:line[len-1]}};
  return {len,s0,stopT,pk,keep:run(()=>amt),pause:run(t=>(t>=stopT&&t<stopT+6)?0:amt),stop:run(t=>t>=stopT?0:amt)};

}

function fctx(){

function optionList(c){
  const f=c.f,sip=c.sip,defs=optDefs(sip),reason=f.reason,failed=S.flags.failedDebit&&sip.id===S.d.attempt.sipId;
  let order=['skip','pause2','reduce25','reduce50','pause3'];
  if(reason==='cash')order=['move','skip','reduce25','pause2','reduce50'];
  if(failed)order=['move'].concat(order.filter(x=>x!=='move'));
  else if(reason!=='cash')order=order.filter(x=>x!=='move');
  const origKey=attemptKey(f.attempt,sip),keep=calcR(c,'keep'),orig=calcR(c,origKey),origCost=keep.p50-orig.p50,out=[];
  for(const k of order){

  }
  const f=newFlow(sipId,attempt);S.flow=f;
  const days=sip.lastCheck?(Date.now()-sip.lastCheck)/864e5:null;
  if(S.flags.nearEnd||sip.done>=sip.tenure-2){
    f.step='c5';f.prev='c0';f.choice='proceed';f.suppressed='This SIP is close to its end date, so the change is small. Checkpoint skipped ahead to the confirm step.';

  }else if(S.flags.repeatRule&&sip.lastCheck&&days<7){
    f.step='c5';f.prev='c0';f.choice='proceed';f.suppressed='You looked at this SIP in the last 7 days, so Checkpoint skipped ahead. Your earlier decision is in the decision log.';
    track('checkpoint_suppressed',{rule:'repeat_7d'});
  }else if(S.flags.tiny||sip.amount<500){
    f.light=true;f.step='c2';track('checkpoint_light',{});
    try{const c=fctx();track('two_futures_viewed',{goal_id:c.goal?c.goal.id:'none',proxy_used:!!calcR(c,'keep').proxyUsed,light:true})}catch(e){}
  }
  S.modal=null;renderLayer();
}
function viewedTwo(f){

    track('two_futures_viewed',{goal_id:c.goal?c.goal.id:'none',proxy_used:!!k.proxyUsed,little_change:isLittle(c,k,a)})}

function pctOf(c,r){return (!c.rangeOnly&&r&&r.pctReach!=null)?Math.round(r.pctReach):null}
function recordDecision(f,fin){
  const c=fctx(),sip=c.sip;let keepPct=null,actPct=null;
  try{if(!c.rangeOnly){keepPct=pctOf(c,calcR(c,'keep'));actPct=pctOf(c,calcR(c,f.choice==='keep'?attemptKey(f.attempt,sip):attemptKey(fin,sip)))}}catch(e){}
  const label=FUNDS[sip.fundKey].label;
  const fu=(f.choice!=='keep'&&(f.note||fin.type==='pause'||fin.type==='skip'))?addDaysISO('2026-09-29',90):null;
  const d={id:'D'+(++S.seq),sipId:sip.id,title:f.choice==='keep'?'Kept '+label:actVerb(fin)+' '+label,short:short(fin,sip),when:fmtDate('2026-09-29'),
    reasonLabel:reasonLabel(f.reason),choice:f.choice,keepPct,actPct,note:f.note.trim(),followup:fu};
  S.d.decisions.push(d);
  if(f.note.trim())track('note_added',{length:f.note.trim().length});
  track('decision_made',{choice:f.choice,reason:f.reason||'skipped',action:fin.type,total_ms:Date.now()-f.startedAt,taps:f.taps});
  sip.lastCheck=Date.now();
  return d;
}
function flowAct(a,p){
  const f=S.flow;if(!f)return;
  const tapCount=['fmath','fmathclose','fuse','fpurpose','fpick','fgoalsave'];
  if(!tapCount.includes(a))f.taps++;
  const sip=getSip(f.sipId);
  switch(a){
    case 'ftake':f.step='c1';break;
    case 'fskip':track('checkpoint_skipped',{step:'c0'});f.prev='c0';f.step='c5';f.phase='review';f.choice='proceed';break;
    case 'freason':
      f.reason=p==='skip'?null:p;track('reason_selected',{reason:p==='skip'?'skipped':p});
      f.step='c2';f.slider=null;viewedTwo(f);break;
    case 'fproceed':track('proceed_clicked',{step:f.step});f.prev=f.step;f.step='c5';f.phase='review';f.choice='proceed';break;
    case 'fnext':
      if(f.step==='c2')f.step=f.light?'c4':'c3';
      else if(f.step==='c3')f.step='c4';
      break;
    case 'fback':
      if(f.step==='c1')f.step='c0';
      else if(f.step==='c2'){if(f.light){S.flow=null;S.modal=null;renderLayer();return}f.step='c1'}
      else if(f.step==='c3')f.step='c2';
      else if(f.step==='c4')f.step=f.light?'c2':'c3';
      else if(f.step==='c5'){f.step=f.prev&&f.prev!=='c5'?f.prev:'c4';f.choice=null;f.suppressed=null}
      break;
    case 'fmath':f.math=true;track('math_opened',{step:f.step});break;
    case 'fmathclose':f.math=false;break;
    case 'fpick':{
      let list=[];try{list=optionList(fctx())}catch(e){}
      const o=list.find(x=>x.key===p);
      if(f.smaller&&f.smaller.key===p)f.smaller=null;
      else if(o){f.smaller={key:o.key,label:o.label,action:o.action,grid:o.grid};track('option_selected',{option:o.key})}
      break}
    case 'fuse':{
      const c=fctx();
      if(f.attempt.type==='pause'&&f.slider)f.attempt={type:'pause',k:f.slider};
      else if(f.attempt.type==='reduce'&&f.slider!=null){
        const amt=Math.min(sip.amount-1,Math.max(500,Math.round(sip.amount*(1-f.slider/100))));
        f.attempt={type:'reduce',newAmount:amt};
      }
      track('slider_applied',{value:f.slider});f.slider=null;f.smaller=null;break}
    case 'fpurpose':{
      f.purpose=p;f.horizonYears={House:7,Retirement:10,Education:5,Wedding:3,General:5}[p]||5;
      track('purpose_selected',{purpose:p});break}
    case 'fdecide':{
      f.choice=p;f.prev=f.step;
      if(p==='keep'){
        recordDecision(f,f.attempt);
        addActivity({id:'CHK_'+S.seq,name:'Checkpoint: kept '+FUNDS[sip.fundKey].label,amount:sip.amount,status:'Completed',date:nowStamp(),sip:sip.id,ic:'shield',detail:'You chose to keep this SIP as it is.'+(f.note.trim()?' Note: '+f.note.trim():'')});
        f.phase='done';f.step='c5';
      }else{f.step='c5';f.phase='review'}
      break}
    case 'fconfirm':{
      const fin=f.choice==='smaller'&&f.smaller?f.smaller.action:f.attempt;
      f.origNext=sip.nextDebit;
      const snap=JSON.stringify(sip);
      const d=recordDecision(f,fin);f.decisionId=d.id;
      applyAction(sip,fin);f.snap=snap;
      f.actId='CHK_'+S.seq;
      addActivity({id:f.actId,name:'Checkpoint: '+actVerb(fin).toLowerCase()+' '+FUNDS[sip.fundKey].label,amount:sip.amount,status:'Completed',date:nowStamp(),sip:sip.id,ic:'shield',detail:describeAction(fin,JSON.parse(snap),'done')+(f.note.trim()?' Note: '+f.note.trim():'')});
      f.phase='done';f.step='c5';break}
    case 'fundo':{
      if(f.snap){
        const i=S.d.sips.findIndex(s=>s.id===f.sipId);S.d.sips[i]=JSON.parse(f.snap);
        const d=S.d.decisions.find(x=>x.id===f.decisionId);if(d){d.followup=null;d.undone=true}
        addActivity({id:'CHK_'+(++S.seq),name:'Checkpoint: change undone, '+FUNDS[sip.fundKey].label,amount:S.d.sips[i].amount,status:'Completed',date:nowStamp(),sip:f.sipId,ic:'undo',detail:'You undid the change. The SIP is back to how it was.'});
        track('undo_clicked',{sip_id:f.sipId});
      }
      S.flow=null;renderLayer();rerender();toast('Change undone');return}
    case 'fdone':S.flow=null;S.modal=null;rerender();return;
    case 'fclose':
      track('checkpoint_closed',{step:f.step,phase:f.phase});
      S.flow=null;S.modal=null;rerender();return;
    case 'fgoalsave':{
      const g=S.d.goals.find(x=>x.id===sip.goalId);
      if(g&&f.goalDraft){g.target=f.goalDraft.target;g.date=f.goalDraft.date;f.goalDraft=null;track('goal_updated',{goal_id:g.id});toast('Goal saved')}
      break}
  }
  renderLayer();
  if(a==='fdecide'&&f.choice==='keep'||a==='fconfirm')rerender();
}

function openModal(p,el){

    case 'sipgoal':{const s=getSip(el.dataset.p);if(s){s.goalId=el.value||null;track('goal_tagged',{sip_id:s.id,goal_id:el.value||'none'});toast(el.value?'Goal tag saved':'Goal tag removed');rerender()}break}
    case 'mamt':renderLayer();break;
    case 'slider':if(f)track('slider_changed',{value:f.slider,action:f.attempt.type});break;
    case 'horizon':if(f)track('horizon_changed',{years:f.horizonYears});break;
    case 'gtarget':case 'gdate':
      if(f){
        if(k==='gtarget'&&!(Math.round(+el.value)>=10000))toast('Enter a target of at least ₹10,000');
        else if(k==='gdate'&&!(/^\d{4}-\d{2}$/.test(el.value)&&el.value>='2026-10'))toast('Pick a month after this month');
        else renderLayer();
      }
      break;
  }
});

document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k||!k.startsWith('sim')&&k!=='repamt')return;
  const s=S.sim;
  if(k==='simslider'){if(s.type==='pause')s.k=+el.value;else s.pct=+el.value;const c=simCtx();if(!c)return;const l=$('#simlbl');if(l)l.textContent=s.type==='pause'?plural(s.k,'month'):s.pct+'% ('+inr(c.sip.amount*(1-s.pct/100))+' a month)';$('#simdyn').innerHTML=simDyn(c)}
  else if(k==='simyears'){s.years=+el.value;const c=simCtx();if(!c)return;const l=$('#simylbl');if(l)l.textContent=plural(s.years,'year');$('#simdyn').innerHTML=simDyn(c)}
  else if(k==='repamt'){const v=Math.round(+el.value);if(v>=500&&v<=500000){s.amt=v;$('#repdyn').innerHTML=repDyn()}}
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.dataset&&el.dataset.in==='simsip'){S.sim.sipId=el.value;rerender()}
});
/* chart hover */
function hideTips(){document.querySelectorAll('.tfchart').forEach(t=>{const c=t.querySelector('.cross'),p=t.querySelector('.tip');if(c)c.style.display='none';if(p)p.style.display='none'});S._tipOn=false}
function chartHover(hit,e){
  const wrap=hit.closest('.tfchart'),svg=hit.ownerSVGElement,cx=S.chartCtx;if(!wrap||!svg||!cx)return;
  const r=svg.getBoundingClientRect(),sc=r.width/720,pl=+hit.dataset.pl,w=+hit.dataset.w,H=+wrap.dataset.h;
  const x=(e.clientX-r.left)/sc,t=Math.max(0,Math.min(H-1,Math.round((x-pl)/w*(H-1)))),X=pl+w*t/Math.max(1,H-1);
  const cr=wrap.querySelector('.cross'),tip=wrap.querySelector('.tip');
  cr.setAttribute('x1',X);cr.setAttribute('x2',X);cr.style.display='';
  tip.innerHTML='<b>'+dateOfM(t+1)+'</b><br>Keep: '+lakhTxt(cx.keep.s50[t])+'<br>After change: '+lakhTxt(cx.act.s50[t]);
  tip.style.display='block';
  const px=X*sc,tw=tip.offsetWidth;tip.style.left=Math.max(4,Math.min(r.width-tw-4,px+12))+'px';
  S._tipOn=true;
}
['pointermove','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{
  const hit=e.target.closest&&e.target.closest('.tfchart .hit');
  if(hit)chartHover(hit,e);else if(S._tipOn)hideTips();
}));

document.addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
  if(e.key==='Escape'){if(closeTop())e.preventDefault();return}
  if((e.key==='d'||e.key==='D')&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){S.demoHidden=!S.demoHidden;renderLayer()}
  if(e.key==='Enter'&&typing&&t.dataset.in==='note'){e.preventDefault()}
});
window.addEventListener('resize',()=>{if(S.pop){S.pop=null;renderLayer()}});


/* ===== TAB TRANSITIONS: content flows in from the side of the selected tab ===== */
const VIEW_ORDER=['overview','sips','sip','goals','activity','insights','health','sim','how','settings'];
S._lastView=S.view;
function tabSnap(view){
  const m={};
  document.querySelectorAll('.navpill,.tabs,.seg2').forEach(g=>{
    const bs=[...g.querySelectorAll(':scope>button')],i=bs.findIndex(b=>b.classList.contains('on'));if(i<0)return;
    const act=bs[0].dataset.a||'x',key=g.classList.contains('navpill')?'nav':view+'|'+act;
    m[key]={i,x:bs[i].getBoundingClientRect().left,act,el:bs[i],g};
  });
  return m;
}
function flow(el,dir){el.classList.remove('flowL','flowR');void el.offsetWidth;el.classList.add(dir>0?'flowR':'flowL')}
function subTargets(act,g){
  const q=x=>[...document.querySelectorAll(x)];
  if(act==='sipf'||act==='acttab'||act==='simtab')return q('#main > :not(.pagehd)');
  if(act==='mktf')return q('#mkt > :not(.hd)');
  if(act==='navr')return [...((g.closest('section')||document).querySelectorAll('svg:not(.i)'))];
  if(act==='simtype')return q('#simslot,#simdyn');
  if(act==='repfund')return q('#repdyn');
  return [];
}
const _renderBase=render;
render=function(){
  const before=tabSnap(S._lastView);
  _renderBase();
  const after=tabSnap(S.view),main=document.getElementById('main');
  if(S._lastView!==S.view&&main){
    const a=VIEW_ORDER.indexOf(S._lastView),b=VIEW_ORDER.indexOf(S.view);
    if(a>=0&&b>=0&&a!==b)flow(main,b>a?1:-1);
  }
  Object.keys(after).forEach(k=>{
    const A=after[k],B=before[k];if(!B)return;
    const dx=B.x-A.x;
    if(Math.abs(dx)>2){
      const el=A.el;el.style.position='relative';el.style.zIndex='1';el.style.transition='none';el.style.transform='translateX('+dx+'px)';void el.offsetWidth;
      el.style.transition='transform .4s cubic-bezier(.22,.9,.3,1)';el.style.transform='';
    }
    if(k!=='nav'&&B.i!==A.i)subTargets(A.act,A.g).forEach(t=>flow(t,A.i>B.i?1:-1));
  });
  S._lastView=S.view;
};

/* ===== BOOT ===== */
loadPersona('arjun');
render();

</script>
